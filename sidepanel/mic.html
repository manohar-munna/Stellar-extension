<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stellar — microphone</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; background: #f5f6fa; color: #151b2e; }
      @media (prefers-color-scheme: dark) { body { background: #0f1220; color: #e8eaf5; } }
      main { max-width: 440px; padding: 24px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 10px; color: #6b7290; }
      .ok { color: #0f9d63; font-weight: 600; }
      .bad { color: #d14343; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>🎤 Allow the microphone</h1>
      <p>Chrome can't show the microphone prompt inside the side panel, so Stellar asks once here. Choose <b>Allow</b>.</p>
      <p id="state">Waiting for your choice…</p>
    </main>
    <script src="mic.js"></script>
  </body>
</html>
